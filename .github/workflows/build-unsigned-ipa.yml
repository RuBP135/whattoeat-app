name: Build Unsigned iOS IPA (WhatToEat2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - release/**
      - feature/multilingual
      - feature/calendar

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APP_NAME: WhatToEat
      XCODE_PROJ_PATH: iosApp/iosApp.xcodeproj
      XCODE_SCHEME: iosApp
      KONAN_CACHE_PATH: ~/.konan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 21 Corretto
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version
          echo "===== schemes ====="
          xcodebuild -list -project "${{ env.XCODE_PROJ_PATH }}"

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Cache Konan Compiler
        uses: actions/cache@v4
        with:
          path: ${{ env.KONAN_CACHE_PATH }}
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Xcode Build Release iPhoneOS (Unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ env.XCODE_PROJ_PATH }}" \
            -scheme "${{ env.XCODE_SCHEME }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "${{ runner.temp }}/DerivedData" \
            -name "${{ env.APP_NAME }}.app" \
            -path "*/Release-iphoneos/*" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app，输出 DerivedData 结构："
            find "${{ runner.temp }}/DerivedData" -maxdepth 5 -type d 2>/dev/null || true
            echo "===== xcodebuild 日志尾部 ====="
            tail -100 xcodebuild.log
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload \
            "${{ env.APP_NAME }}-iOS-unsigned.ipa"

          ls -lh *.ipa
          echo "===== IPA 内容 ====="
          unzip -l "${{ env.APP_NAME }}-iOS-unsigned.ipa" | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-Release-Unsigned
          path: ${{ env.APP_NAME }}-iOS-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: xcodebuild.log
          retention-days: 14
